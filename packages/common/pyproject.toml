[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-common"
version = "0.1.0"
description = "ATLAS shared runtime helpers: config, logging, clock, money, streams"
requires-python = ">=3.12"
# Deliberately light: money, clock and config must be testable with the standard library
# alone. structlog is optional and falls back to stdlib logging when absent.
dependencies = ["atlas-schemas"]

[project.optional-dependencies]
logging = ["structlog>=24"]
pydantic = ["pydantic>=2.7,<3", "pydantic-settings>=2"]
test = ["pytest>=8", "hypothesis>=6", "time-machine>=2.13"]

[tool.setuptools.packages.find]
include = ["atlas_common*"]

[tool.setuptools.package-data]
atlas_common = ["py.typed"]

[tool.mypy]
python_executable = "${MYPY_CONFIG_FILE_DIR}/../../.venv/bin/python"
mypy_path = ["../../packages/common", "../../packages/schemas"]
