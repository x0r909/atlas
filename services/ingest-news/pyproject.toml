[project]
name = "atlas-ingest-news"
version = "0.0.0"
description = "ATLAS news ingestion: free RSS allowlist only, no paid vendor path"
requires-python = ">=3.12"
dependencies = [
  "atlas-common",
  "atlas-schemas",
  "httpx>=0.27",
  "feedparser>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atlas_news"]

[tool.mypy]
python_executable = "${MYPY_CONFIG_FILE_DIR}/../../.venv/bin/python"
mypy_path = [
  "../../packages/common",
  "../../packages/schemas",
  "../../services/ingest-news",
]
explicit_package_bases = true
namespace_packages = true
# feedparser, asyncpg and httpx ship no stubs of their own; the boundary is ours.
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["feedparser", "asyncpg"]
ignore_missing_imports = true
