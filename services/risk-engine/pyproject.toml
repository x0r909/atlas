[project]
name = "atlas-risk-engine"
version = "0.1.0"
description = "Deterministic pre-trade gate: pure rules in, signed verdict out"
requires-python = ">=3.12"
dependencies = [
  "atlas-schemas",
  "atlas-common",
  "pydantic>=2.7",
  "asyncpg>=0.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atlas_risk"]

[tool.mypy]
python_executable = "${MYPY_CONFIG_FILE_DIR}/../../.venv/bin/python"
mypy_path = ["../../packages/common", "../../packages/schemas", "."]
explicit_package_bases = true
namespace_packages = true
strict = true
