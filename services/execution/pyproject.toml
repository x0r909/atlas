[project]
name = "atlas-execution"
version = "0.1.0"
description = "ATLAS execution service: signed orders in, venue calls and fills out"
requires-python = ">=3.12"
dependencies = [
  "atlas-schemas",
  "atlas-common",
  "pydantic>=2.7",
  "httpx>=0.27",
  "redis>=5.0",
  "SQLAlchemy[asyncio]>=2.0.36",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atlas_execution"]

[tool.mypy]
python_executable = "../../.venv/bin/python"
mypy_path = ["../../packages/common", "../../packages/schemas", "../../services/execution"]
explicit_package_bases = true
namespace_packages = true
