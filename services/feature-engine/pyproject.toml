[project]
name = "atlas-feature-engine"
version = "0.0.0"
description = "ATLAS feature engine: staleness, news enrichment"
requires-python = ">=3.12"
dependencies = ["atlas-common", "atlas-schemas"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atlas_features"]

[tool.hatch.build.targets.wheel.force-include]
"atlas_features/py.typed" = "atlas_features/py.typed"

[tool.mypy]
python_executable = "${MYPY_CONFIG_FILE_DIR}/../../.venv/bin/python"
mypy_path = [
  "../../packages/common",
  "../../packages/schemas",
  "../../services/feature-engine",
]
explicit_package_bases = true
namespace_packages = true
