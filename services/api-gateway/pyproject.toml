[project]
name = "atlas-api"
version = "0.1.0"
description = "ATLAS API gateway and operator terminal backend"
requires-python = ">=3.12"
dependencies = [
  "atlas-schemas",
  "atlas-common",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.7",
  "redis>=5.0",
  "SQLAlchemy[asyncio]>=2.0.36",
  "pyotp>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atlas_api"]

[tool.mypy]
python_executable = "../../.venv/bin/python"
mypy_path = ["../../packages/common", "../../packages/schemas", "../../services/api-gateway"]
explicit_package_bases = true
namespace_packages = true
