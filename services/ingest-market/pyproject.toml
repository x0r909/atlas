[project]
name = "atlas-ingest-market"
version = "0.1.0"
description = "ATLAS market data ingestion"
requires-python = ">=3.12"
dependencies = ["atlas-schemas", "atlas-common", "redis>=5.0", "asyncpg>=0.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atlas_ingest_market"]

[tool.mypy]
python_executable = "${MYPY_CONFIG_FILE_DIR}/../../.venv/bin/python"
mypy_path = ["../../packages/common", "../../packages/schemas", "../../services/ingest-market"]
explicit_package_bases = true
namespace_packages = true
