---
# Local and single-VPS compose stack (M0+).
#
# TimescaleDB + pgvector is the single database; Redis is the bus. The nine
# application services sit behind the `app` profile because at M3 they are only
# partly runnable: `docker compose up` on a fresh clone must start infrastructure
# only, not nine services that cannot run yet.
#
# Credential boundary (FR-064, docs/adr/0002-credential-boundary.md):
#   * execution is the only process that receives venue key material;
#   * inspection of the whole file is tested in tests/security/test_credential_isolation.py;
#   * every secret arrives as a file under /run/secrets, never as an environment value,
#     because `environment:` is visible in `docker inspect` and in any crash dump.
name: atlas

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Shared, non-secret configuration. A service opts into more only by naming it.
x-common-env: &common-env
  ATLAS_MODE: PAPER
  # Double-quoted with a trailing backslash so the URL stays one scalar while the
  # physical line stays inside the 80-column YAML budget.
  ATLAS_DB_DSN: "postgresql+asyncpg://${POSTGRES_USER:-atlas}:\
    ${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB:-atlas}"
  ATLAS_REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
  ATLAS_LOG_LEVEL: INFO

x-app-service: &app-service
  restart: unless-stopped
  depends_on:
    timescaledb: {condition: service_healthy}
    redis: {condition: service_healthy}
  logging: *default-logging

services:
  timescaledb:
    # The -ha variant bundles pgvector, which the embedding tables need at M6.
    image: timescale/timescaledb-ha:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atlas}
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - timescale-data:/home/postgres/pgdata/data
      - ../db/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Loopback only: the database is never reachable from the internet.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U ${POSTGRES_USER:-atlas}
          -d ${POSTGRES_DB:-atlas}
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *default-logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # noeviction is deliberate: an evicted stream entry is a lost order or a
    # lost verdict. The 384 MB cap is the plan's budget for the LXC.
    command:
      - redis-server
      - --maxmemory
      - 384mb
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - ${REDIS_PASSWORD:?required}
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - --no-auth-warning
        - -a
        - ${REDIS_PASSWORD}
        - ping
      interval: 5s
      timeout: 3s
      retries: 12
    logging: *default-logging

  # --- application services (profile: app) ---------------------------------
  ingest-market:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.service
      args: {SERVICE: ingest-market}
    <<: *app-service
    environment:
      <<: *common-env
    # Public market data only. No key, no private endpoint.
    x-egress: {enforced_by: docker-network, hosts: ["indodax.com"]}
    command: ["atlas_ingest_market"]

  ingest-news:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.service
      args: {SERVICE: ingest-news}
    <<: *app-service
    environment:
      <<: *common-env
    x-egress:
      enforced_by: docker-network
      hosts:
        - coindesk.com
        - cointelegraph.com
        - decrypt.co
        - theblock.co
        - bitcoinmagazine.com
        - cryptoslate.com
        - coinvestasi.com
        - ojk.go.id
    command: ["atlas_ingest_news"]

  feature-engine:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.service
      args: {SERVICE: feature-engine}
    <<: *app-service
    environment:
      <<: *common-env
    x-egress: {enforced_by: none-required, hosts: []}
    command: ["atlas_feature_engine"]

  agents:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.service
      args: {SERVICE: agents}
    <<: *app-service
    environment:
      <<: *common-env
      # The only credential an agent process may see: the model provider key.
      ATLAS_LLM_API_KEY_FILE: /run/secrets/llm_api_key
    secrets: [llm_api_key]
    # The provider host is fixed in Phase 9 (T091); until then it is not routable.
    x-egress: {enforced_by: docker-network, hosts: ["llm-provider.invalid"]}
    command: ["atlas_agents"]

  risk-engine:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.service
      args: {SERVICE: risk-engine}
    <<: *app-service
    environment:
      <<: *common-env
      # Signing key only: a verdict can be produced here but no order placed from here.
      ATLAS_ORDER_HMAC_KEY_FILE: /run/secrets/order_hmac_key
    secrets: [order_hmac_key]
    x-egress: {enforced_by: none-required, hosts: []}
    command: ["atlas_risk_engine"]

  execution:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.service
      args: {SERVICE: execution}
    <<: *app-service
    environment:
      <<: *common-env
      ATLAS_INDODAX_API_KEY_FILE: /run/secrets/indodax_api_key
      ATLAS_INDODAX_API_SECRET_FILE: /run/secrets/indodax_api_secret
      # Execution re-checks the signature, so it needs the same key as risk-engine.
      ATLAS_ORDER_HMAC_KEY_FILE: /run/secrets/order_hmac_key
    secrets: [indodax_api_key, indodax_api_secret, order_hmac_key]
    x-egress: {enforced_by: docker-network, hosts: ["indodax.com"]}
    command: ["atlas_execution"]

  stop-monitor:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.service
      args: {SERVICE: stop-monitor}
    <<: *app-service
    environment:
      <<: *common-env
    # The stop monitor routes every mutation through execution; it calls no venue itself.
    x-egress: {enforced_by: none-required, hosts: []}
    command: ["atlas_stopmon"]

  backtester:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.service
      args: {SERVICE: backtester}
    <<: *app-service
    environment:
      <<: *common-env
    x-egress: {enforced_by: none-required, hosts: []}
    command: ["atlas_backtester"]

  api-gateway:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.service
      args: {SERVICE: api-gateway}
    <<: *app-service
    environment:
      <<: *common-env
      # The gateway may alert the operator, and may do nothing else on the network.
      ATLAS_TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
    secrets: [telegram_bot_token]
    x-egress: {enforced_by: docker-network, hosts: ["api.telegram.org"]}
    command: ["atlas_api"]
    ports:
      # Only the gateway is reachable from outside, and only over Tailscale.
      - "127.0.0.1:8080:8080"

# Files live outside the repository by construction: a checkout never contains a secret.
secrets:
  indodax_api_key:
    file: /etc/atlas/secrets/indodax_api_key
  indodax_api_secret:
    file: /etc/atlas/secrets/indodax_api_secret
  order_hmac_key:
    file: /etc/atlas/secrets/order_hmac_key
  llm_api_key:
    file: /etc/atlas/secrets/llm_api_key
  telegram_bot_token:
    file: /etc/atlas/secrets/telegram_bot_token

volumes:
  timescale-data:
  redis-data:
