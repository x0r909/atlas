# Alembic configuration for the ATLAS schema.
#
# The URL is never written here: env.py reads ATLAS_DB_DSN so a migration run cannot
# accidentally target a database that a config file happened to name.
[alembic]
script_location = infra/db
prepend_sys_path = .
version_path_separator = os
# Timestamped, ordered revision files: 0001 is authored in T018, and the numeric prefix
# makes the order obvious in a directory listing (plan.md: hand-written SQL migrations).
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 60

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
